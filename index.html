<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Color Palette</title>
    <link rel="stylesheet" href="style.css">

    <!-- เรียกใช้ app.js เป็น ES Module เพื่อนำเข้า AI Library (Transformers.js) -->
    <script type="module" src="app.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <h1 class="logo">Smart AI Color Palette</h1>
                <button id="langToggleBtn" class="lang-btn">EN / TH</button>
            </div>
            <p id="subTitle" class="subtitle">ระบบวิเคราะห์อารมณ์จากข้อความพร้อมแนะนำจานสี</p>
        </header>

        <!-- Main Card -->
        <main class="main-card">
            <div class="input-section">
                <label id="inputLabel" for="textInput" class="input-label">กรอกข้อความภาษาไทยหรืออังกฤษเพื่อวิเคราะห์อารมณ์ด้วย AI Model</label>
                <textarea id="textInput" class="text-input" rows="4" placeholder="พิมพ์ความรู้สึกของคุณ เช่น I feel sad หรือ I feel happy..."></textarea>
                
                <div id="alertBox" class="alert-box" style="display: none;"></div>

                <div class="button-group">
                    <button id="analyzeBtn" class="btn btn-primary">วิเคราะห์อารมณ์ (Analyze)</button>
                    <button id="uploadTriggerBtn" class="btn btn-secondary">อัปโหลดรูปภาพ (Extract Image)</button>
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                </div>
            </div>

            <!-- Uploaded Image Preview & Extracted Palette Section -->
            <div id="extractedPaletteSection" class="extracted-section" style="display: none;">
                <h3 class="result-title">รูปภาพที่อัปโหลดและจานสีที่สกัดได้</h3>
                <div class="image-preview-container">
                    <img id="imagePreview" src="" alt="Preview" class="image-preview">
                </div>
                <div id="extractedPalette" class="palette-display"></div>
            </div>

            <hr class="divider">

            <!-- Result Section -->
            <div class="result-section">
                <div class="emotion-info">
                    <h2 id="resultEmotion" class="emotion-title">ผลลัพธ์อารมณ์: <span id="emotionLabel" class="highlight-emotion">READY</span></h2>
                    <p id="resultConfidence" class="confidence-text">ค่าความเชื่อมั่น: <span id="confidenceValue">-</span></p>
                </div>

                <div class="palette-container">
                    <h3 id="paletteTitle" class="section-subtitle">ชุดจานสีแนะนำ (WCAG Compliant)</h3>
                    <div id="paletteDisplay" class="palette-display"></div>
                </div>

                <!-- AI Design Advisory -->
                <div class="advisory-section">
                    <h4>คำแนะนำการออกแบบโดย AI</h4>
                    <p><strong>ธีมที่แนะนำ: </strong><span id="themeName">-</span></p>
                    <p><strong>ชุดฟอนต์: </strong><span id="fontPairing">-</span></p>
                    <p><strong>การนำไปใช้งาน: </strong><span id="usageContext">-</span></p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
