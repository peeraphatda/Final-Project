<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Art & Palette Sentiment Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <h1 class="logo">Smart Art & Palette Sentiment Analyzer</h1>
            <p id="subTitle">ระบบวิเคราะห์อารมณ์จากข้อความพร้อมแนะนำจานสี</p>
            <button id="langToggleBtn" class="lang-btn">TH / EN</button>
        </header>

        <!-- Main Card -->
        <main class="card">
            <!-- Text Input Section -->
            <section class="input-section">
                <label id="inputLabel" for="textInput">กรอกข้อความภาษาไทยหรืออังกฤษเพื่อวิเคราะห์อารมณ์ด้วย AI Model</label>
                <textarea id="textInput" placeholder="พิมพ์ความรู้สึกของคุณ เช่น I feel sad หรือ I feel happy..."></textarea>
                <div id="alertBox" class="alert-box"></div>
                
                <div class="button-group">
                    <button id="analyzeBtn" class="btn btn-primary">วิเคราะห์อารมณ์ (Analyze)</button>
                    <button id="uploadTriggerBtn" class="btn btn-secondary">อัปโหลดรูปภาพ (Extract Image)</button>
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                </div>
            </section>

            <!-- Image Result Section (Hide by default) -->
            <section id="extractedPaletteSection" class="extracted-section" style="display: none;">
                <h3 class="result-title">รูปภาพที่อัปโหลดและจานสีที่สกัดได้</h3>
                <div class="image-preview-container">
                    <img id="imagePreview" alt="Image Preview" />
                </div>
                <div id="extractedPalette" class="palette-grid"></div>
            </section>

            <!-- Result Section -->
            <section class="result-section">
                <div class="emotion-box">
                    <p id="resultEmotion"><span id="emotionLabel">-</span></p>
                    <p id="resultConfidence"><span id="confidenceValue">-</span></p>
                </div>

                <div class="palette-container">
                    <h3 id="paletteTitle">ชุดจานสีแนะนำ (WCAG Compliant)</h3>
                    <div id="paletteDisplay" class="palette-grid"></div>
                </div>
            </section>

            <!-- AI Design Advisory Section -->
            <section class="advisory-section">
                <h4>คำแนะนำการออกแบบโดย AI</h4>
                <p><strong>ธีมที่แนะนำ: </strong><span id="themeName">-</span></p>
                <p><strong>ชุดฟอนต์: </strong><span id="fontPairing">-</span></p>
                <p><strong>การนำไปใช้งาน: </strong><span id="usageContext">-</span></p>
            </section>

            <!-- History Section -->
            <section class="history-section">
                <div class="history-header">
                    <h3 id="historyTitle">ประวัติการวิเคราะห์ (History)</h3>
                    <button id="clearHistoryBtn" class="clear-btn">ล้างประวัติ</button>
                </div>
                <div id="historyList" class="history-list">
                    <!-- รายการประวัติจะถูกเรนเดอร์ผ่าน JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
