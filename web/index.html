<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sentiment Color Palette Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header style="position: relative;">
            <h1>AI Color Generator</h1>
            <p id="subTitle">ระบบวิเคราะห์อารมณ์จากข้อความพร้อมแนะนำจานสีสำหรับงานออกแบบ UI/UX</p>
            <button type="button" id="langToggleBtn" style="position: absolute; right: 0; top: 0;">EN</button>
        </header>

        <!-- Input Section -->
        <section class="input-section">
            <label id="inputLabel" for="textInput" class="input-label">กรอกข้อความภาษาไทยหรืออังกฤษเพื่อวิเคราะห์อารมณ์ด้วย AI Model</label>
            <textarea id="textInput" placeholder="พิมพ์ความรู้สึกของคุณ เช่น I feel sad หรือ I feel happy..."></textarea>
            
            <div class="action-buttons" style="margin-top: 15px; display: flex; gap: 10px;">
                <button type="button" id="analyzeBtn" class="btn-primary">วิเคราะห์อารมณ์ (Analyze)</button>
                <button type="button" id="uploadTriggerBtn" class="btn-secondary">อัปโหลดรูปภาพ (Extract Image)</button>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </div>
            
            <div id="alertBox" class="alert-box" style="display: none; color: red; margin-top: 10px;"></div>
        </section>

        <!-- Result Section -->
        <section class="result-section" style="margin-top: 30px;">
            <div class="result-header" style="display: flex; justify-content: space-between; align-items: center;">
                <span id="emotionLabel" class="emotion-badge">-</span>
                <span id="confidenceValue" style="font-weight: bold; color: #64748b;">0%</span>
            </div>

            <!-- ส่วนหัวข้อจานสี + กลุ่มปุ่ม Export และ Copy Code ครบชุด -->
            <div class="palette-header-container" style="display: flex; justify-content: space-between; align-items: center; margin-top: 25px; flex-wrap: wrap; gap: 10px;">
                <h3 id="paletteTitle" style="margin: 0;">ชุดจานสีแนะนำสมมาตร (8 Color Palette)</h3>
                
                <!-- กลุ่มปุ่ม Export และ Copy Code -->
                <div class="export-container" style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
                    <!-- ปุ่ม Export ไฟล์ -->
                    <button type="button" id="exportAseBtn" class="btn-export" style="background-color: #3182ce; color: white; padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.8rem;">
                        🎨 ASE
                    </button>
                    <button type="button" id="exportJsonBtn" class="btn-export" style="background-color: #475569; color: white; padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.8rem;">
                        📄 JSON
                    </button>
                    <button type="button" id="exportFigmaBtn" class="btn-export" style="background-color: #059669; color: white; padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.8rem;">
                        ❖ Figma
                    </button>

                    <!-- ปุ่ม Copy Code ในรูปแบบต่างๆ -->
                    <button type="button" id="copyHexBtn" class="btn-export" style="background-color: #8b5cf6; color: white; padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.8rem;">
                        📋 HEX
                    </button>
                    <button type="button" id="copyRgbBtn" class="btn-export" style="background-color: #ec4899; color: white; padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.8rem;">
                        📋 RGB
                    </button>
                    <button type="button" id="copyHslBtn" class="btn-export" style="background-color: #10b981; color: white; padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.8rem;">
                        📋 HSL
                    </button>
                    <button type="button" id="copyTailwindBtn" class="btn-export" style="background-color: #06b6d4; color: white; padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.8rem;">
                        📋 Tailwind
                    </button>
                    <button type="button" id="copyCssVarBtn" class="btn-export" style="background-color: #f59e0b; color: white; padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.8rem;">
                        📋 CSS Vars
                    </button>
                </div>
            </div>

            <!-- แสดงผลการ์ดจานสี -->
            <div id="paletteDisplay" style="margin-top: 15px;"></div>

            <!-- คำแนะนำการออกแบบ -->
            <div class="advisory-section" style="margin-top: 20px;">
                <p><strong>ธีมที่แนะนำ:</strong> <span id="themeName">-</span></p>
                <p><strong>ชุดฟอนต์:</strong> <span id="fontPairing">-</span></p>
                <p><strong>การนำไปใช้งาน:</strong> <span id="usageContext">-</span></p>
            </div>
        </section>

        <!-- Image Extracted Palette Section -->
        <section id="extractedPaletteSection" class="extracted-section" style="display: none; margin-top: 30px;">
            <div class="image-preview-container">
                <img id="imagePreview" src="" alt="Uploaded Preview" style="max-width: 100%; height: auto;">
            </div>
            <div id="extractedPalette" style="margin-top: 15px;"></div>
        </section>

        <!-- History Section -->
        <section class="history-section" style="margin-top: 40px;">
            <div class="history-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="historyTitle">ประวัติการวิเคราะห์ (History)</h3>
                <button type="button" id="clearHistoryBtn" class="btn-clear" style="background-color: #fee2e2; color: #dc2626; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">ล้างประวัติ</button>
            </div>
            <div id="historyList" class="history-list" style="margin-top: 15px;"></div>
        </section>
    </div>

    <!-- Script Module -->
    <script type="module" src="app.js"></script>
</body>
</html>
